name: Daily Follower Scan

on:
  schedule:
    # 09:00 WIB (UTC+7, no DST) = 02:00 UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run daily scan
        env:
          PROVIDER: ${{ vars.PROVIDER }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: python fetch_followers.py

      - name: Remove service account key
        if: always()
        run: rm -f service_account.json

      - name: Commit updated history and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.csv daily_report.xlsx
          git diff --cached --quiet || git commit -m "Daily follower scan: $(date -u +%Y-%m-%d)"
          git push
